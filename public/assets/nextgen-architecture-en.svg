  <path class="event" d="M678 212H730"/><text class="small" x="704" y="202" text-anchor="middle">DB change</text>
  <rect class="node" x="740" y="181" width="116" height="62" rx="8"/><text class="title" x="750" y="208">CDC Listener</text><text class="sub" x="750" y="226">User + entitlement</text>
  <path class="event" d="M866 212H882"/>
  <rect class="node" x="892" y="181" width="82" height="62" rx="8"/><text class="title" x="913" y="217">Kafka</text>

  <path d="M933 243V262H566M933 262H1072" stroke="#0078d4" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path class="event" d="M566 262V299"/>

