<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Services supporting the user and entitlement journey</title>
  <desc id="desc">Initial-user creation path: CRM Listener consumes CRM Kafka events and calls the User Service API. CDC and Kafka propagate changes to parallel audit, user provisioning and entitlement provisioning consumers. Client creation is outside this view.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7b8d98"/></marker>
    <marker id="eventArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0078d4"/></marker>
    <style>
      .eyebrow{font:700 11.5px Arial,sans-serif;letter-spacing:.075em;fill:#415365}.domainLabel{font:700 11.5px Arial,sans-serif;letter-spacing:.075em;fill:#0078d4}.title{font:700 15px Arial,sans-serif;fill:#142b3b}.coreTitle{font:700 20px Arial,sans-serif;fill:#102c3e}.sub{font:400 12px Arial,sans-serif;fill:#415365}.small{font:600 10.5px Arial,sans-serif;fill:#526678}.node{fill:#fff;fill-opacity:.55;stroke:#b8cbd7}.domain{fill:#f6fbfe;fill-opacity:.86;stroke:#73b9e5}.core{fill:#eaf7ff;stroke:#0078d4;stroke-width:1.9}.service{fill:#fff;fill-opacity:.66;stroke:#acc9da}.line{stroke:#667c89;stroke-width:1.4;fill:none;marker-end:url(#arrow)}.event{stroke:#0078d4;stroke-width:1.5;stroke-dasharray:5 4;fill:none;marker-end:url(#eventArrow)}.icon{fill:none;stroke:#0078d4;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#0078d4}.consumer{font:700 12.5px Arial,sans-serif;fill:#142b3b}.consumerSub{font:400 11px Arial,sans-serif;fill:#415365}
    </style>
  </defs>

