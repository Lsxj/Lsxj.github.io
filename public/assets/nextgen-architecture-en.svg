  <path class="event" d="M42 52H126"/>
  <rect class="node" x="136" y="31" width="111" height="42" rx="7"/>
  <text class="title" x="169" y="56">Kafka</text>
  <path class="event" d="M252 52H282"/>
  <rect class="node" x="292" y="31" width="132" height="42" rx="7"/>
