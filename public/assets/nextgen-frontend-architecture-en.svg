<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="374" viewBox="-24 -18 1248 374" role="img" aria-labelledby="title desc">
  <title id="title">Schema-driven persona UI and Module Federation architecture</title>
  <desc id="desc">Each Persona provides its own metadata and layout, including definitions for any additional data requests. Schema Lens renders the selected Persona and loads those data requests from Criteria Service on interaction. A host composes four independently deployed remote applications.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176a98"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176a98"/></marker>
    <style>
      .eyebrow{font:700 12.5px Arial,sans-serif;letter-spacing:.065em;fill:#176a98}.title{font:700 17px Arial,sans-serif;fill:#152a3b}.hero{font:700 24px Arial,sans-serif;fill:#152a3b}.sub{font:400 13.5px Arial,sans-serif;fill:#152a3b}.small{font:600 12px Arial,sans-serif;fill:#152a3b}.node{fill:#fff;stroke:#176a98;stroke-width:1.3}.focus{fill:#e9f5fd;stroke:#176a98;stroke-width:2}.zone{fill:#ffffff;stroke:#176a98;stroke-width:1.3}.line{stroke:#176a98;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#176a98;stroke-width:2;fill:none;marker-end:url(#blueArrow)}.icon{fill:none;stroke:#176a98;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.remote{fill:#fff;stroke:#176a98;stroke-width:1.3}.remoteTitle{font:700 14.5px Arial,sans-serif;fill:#152a3b}.footer{font:700 12.5px Arial,sans-serif;fill:#152a3b}
    </style>
  </defs>


  <text class="eyebrow" x="0" y="18">DYNAMIC PERSONA RENDERING</text>
  <rect class="node" x="0" y="42" width="210" height="82" rx="10"/>
  <text class="title" x="18" y="68">Persona Service</text>
  <text class="sub" x="18" y="89">Metadata</text>
  <text class="sub" x="18" y="108">Layout JSON</text>
  <path class="line" d="M218 83H248"/>

  <rect class="focus" x="260" y="42" width="250" height="112" rx="12"/>
  <text class="hero" x="284" y="73">Schema Lens</text>
  <text class="sub" x="284" y="103">Metadata → UI components</text>
  <text class="small" x="284" y="128">FIELDS · VALIDATION · STATE</text>

  <text class="small" x="545" y="70" text-anchor="middle">RENDER</text>
  <path class="line" d="M518 84H568"/>
  <rect class="node" x="580" y="42" width="140" height="112" rx="11"/>
  <text class="title" x="598" y="67">Persona UI</text>
  <rect x="598" y="79" width="104" height="23" rx="4" fill="#e9f5fd"/><rect x="598" y="79" width="3" height="23" rx="1.5" fill="#176a98"/><text class="small" x="610" y="94">Permissions</text>
  <rect x="598" y="108" width="104" height="23" rx="4" fill="#e9f5fd"/><rect x="598" y="108" width="3" height="23" rx="1.5" fill="#176a98"/><text class="small" x="610" y="123">Criteria</text>

  <path class="blueLine" d="M395 162V194"/>
  <text class="small" x="407" y="180">LOAD ON INTERACTION</text>
  <rect class="node" x="260" y="198" width="270" height="64" rx="9"/>
  <text class="title" x="278" y="224">Criteria Service</text>
  <text class="sub" x="278" y="247">Returns data for the active UI</text>

  <line x1="0" y1="283" x2="720" y2="283" stroke="#dce3e9"/>
  <text class="footer" x="0" y="307">DESIGN OUTCOME</text>
  <text class="title" x="0" y="333">Different Persona layouts, one shared rendering engine</text>

  <line x1="744" y1="0" x2="744" y2="340" stroke="#dce3e9"/>
  <text class="eyebrow" x="770" y="18">WEBPACK MODULE FEDERATION</text>
  <rect class="zone" x="770" y="34" width="430" height="292" rx="12"/>
  <rect class="focus" x="794" y="52" width="382" height="84" rx="10"/>
  <text class="hero" x="816" y="79">Host</text>
  <text class="sub" x="816" y="103">Routing · user context</text><text class="sub" x="816" y="124">Shared UI · error boundaries</text>
  <path d="M985 136V159M831 159H1139M831 159V178M934 159V178M1037 159V178M1139 159V178" stroke="#176a98" stroke-width="1.5" fill="none"/>
  <rect class="remote" x="794" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="805" y="204">R 01</text>
  <rect class="remote" x="897" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="908" y="204">R 02</text>
  <rect class="remote" x="1000" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="1011" y="204">R 03</text>
  <rect class="remote" x="1102" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="1113" y="204">R 04</text>
  <text class="footer" x="794" y="257">DEPLOYMENT</text><text class="sub" x="892" y="257">Independent Nginx release</text>
  <text class="footer" x="794" y="283">CONTRACT</text><text class="sub" x="794" y="307">Shared dependencies · APIs · failure isolation</text>
</svg>
