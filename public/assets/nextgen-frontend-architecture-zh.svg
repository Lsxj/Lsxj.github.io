<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Schema 驱动的 Persona UI 与 Module Federation 架构</title>
  <desc id="desc">Persona Service 的 metadata 定义布局、权限和 Criteria 调用。Schema Lens 负责渲染界面，并在交互发生时触发 Criteria Service。React Host 组合四个可独立部署的 Remote 应用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718691"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0078d4"/></marker>
    <style>
      .eyebrow{font:700 12px Arial,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.065em;fill:#415365}.title{font:700 16.5px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b3b}.hero{font:700 24px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102c3e}.sub{font:400 13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#415365}.small{font:600 11px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526678}.node{fill:#fff;stroke:#b8cbd7;stroke-width:1.3}.focus{fill:#eaf7ff;stroke:#0078d4;stroke-width:2}.zone{fill:#f6fbfe;stroke:#73b9e5;stroke-width:1.3}.line{stroke:#667c89;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#0078d4;stroke-width:2;fill:none;marker-end:url(#blueArrow)}.icon{fill:none;stroke:#0078d4;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.remote{fill:#fff;stroke:#aac8da;stroke-width:1.3}.remoteTitle{font:700 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b3b}.footer{font:700 12px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#415365}
    </style>
  </defs>
  <rect width="1200" height="270" fill="#fafafa"/>

  <text class="eyebrow" x="0" y="16">动态 PERSONA 渲染</text>
  <rect class="node" x="0" y="32" width="220" height="84" rx="10"/>
  <text class="title" x="18" y="57">Persona Service</text>
  <text class="sub" x="18" y="78">Layout JSON · 权限定义</text>
  <text class="sub" x="18" y="97">Criteria 调用定义</text>
  <path class="line" d="M226 74H240"/>

  <rect class="focus" x="250" y="32" width="230" height="135" rx="12"/>
  <circle cx="290" cy="77" r="22" fill="#d6efff"/>
  <path class="icon" d="M279 66h22v7h-22zM279 80h22v7h-22M284 69.5h.01m0 14h.01m5-14h8m-8 14h8"/>
  <text class="hero" x="323" y="74">Schema Lens</text>
  <text class="sub" x="323" y="95">将 Metadata 映射为 React</text>
  <text class="sub" x="323" y="114">组件、校验与状态</text>
  <text class="small" x="274" y="145">条件 UI · 状态 · API 调用</text>

  <path class="line" d="M488 78H520"/><text class="small" x="490" y="65">渲染</text>
  <rect class="node" x="530" y="32" width="140" height="135" rx="11"/>
  <text class="title" x="548" y="56">Persona UI</text>
  <rect x="548" y="68" width="104" height="23" rx="4" fill="#e5f3fb"/><rect class="icon" x="556" y="75" width="9" height="9" rx="2"/><path class="icon" d="m558 79 2 2 4-5"/><text class="small" x="572" y="83">权限分组</text>
  <rect x="548" y="97" width="104" height="23" rx="4" fill="#f0f6f9"/><circle class="icon" cx="561" cy="108" r="4"/><path class="icon" d="M565 108h5"/><text class="small" x="572" y="112">业务 Criteria</text>
  <rect x="548" y="126" width="104" height="23" rx="4" fill="#f0f6f9"/><path class="icon" d="M557 133h8m-8 5h8"/><text class="small" x="572" y="141">复核提交</text>
  <text class="small" x="548" y="160">CLIENT-SPECIFIC</text>

  <path class="blueLine" d="M365 173V182"/><text class="small" x="375" y="181">交互时触发</text>
  <rect class="node" x="250" y="190" width="230" height="48" rx="9"/>
  <text class="title" x="268" y="212">Criteria Service</text>
  <text class="sub" x="268" y="229">返回 Client 业务数据</text>
  <path class="blueLine" d="M488 214H506V109H520"/>

  <line x1="0" y1="248" x2="670" y2="248" stroke="#c7d6df"/>
  <text class="footer" x="0" y="266">结果</text><text class="title" x="50" y="266">一套 Metadata 模型支持不同 Persona 配置</text>

  <line x1="686" y1="0" x2="686" y2="270" stroke="#c7d6df"/>
  <text class="eyebrow" x="716" y="16">WEBPACK MODULE FEDERATION</text>
  <rect class="zone" x="716" y="32" width="484" height="225" rx="12"/>
  <rect class="focus" x="744" y="50" width="428" height="68" rx="10"/>
  <text class="hero" x="766" y="78">React Host</text>
  <text class="sub" x="766" y="100">路由 · User Context · 共享 UI · Error Boundary</text>

  <path d="M958 118V139M794 139H1122M794 139V153M904 139V153M1012 139V153M1122 139V153" stroke="#7f9eaf" stroke-width="1.5" fill="none"/>
  <rect class="remote" x="746" y="153" width="96" height="48" rx="8"/><text class="remoteTitle" x="758" y="182">Remote 01</text>
  <rect class="remote" x="856" y="153" width="96" height="48" rx="8"/><text class="remoteTitle" x="868" y="182">Remote 02</text>
  <rect class="remote" x="964" y="153" width="96" height="48" rx="8"/><text class="remoteTitle" x="976" y="182">Remote 03</text>
  <rect class="remote" x="1074" y="153" width="96" height="48" rx="8"/><text class="remoteTitle" x="1086" y="182">Remote 04</text>

  <text class="footer" x="746" y="225">部署</text><text class="sub" x="790" y="225">每个应用独立通过 Nginx 发布</text>
  <text class="footer" x="746" y="246">平台契约</text><text class="sub" x="812" y="246">共享依赖、API 与故障隔离</text>
</svg>
