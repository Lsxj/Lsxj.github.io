  <rect class="node" x="292" y="31" width="132" height="42" rx="7"/>
  <text class="title" x="306" y="56">CRM Listener</text>
  <text class="small" x="435" y="43">API</text>

  <text class="eyebrow" x="0" y="104">权限管理</text>
