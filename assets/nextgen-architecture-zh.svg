  <rect class="node" x="464" y="201" width="140" height="62" rx="8"/><g transform="translate(484 217)"><ellipse class="icon" cx="11" cy="4" rx="10" ry="3.5"/><path class="icon" d="M1 4v17c0 2 4 4 10 4s10-2 10-4V4M1 12c0 2 4 4 10 4s10-2 10-4"/><text class="title" x="34" y="20">MongoDB</text></g>
