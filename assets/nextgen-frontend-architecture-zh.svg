<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="374" viewBox="-24 -18 1248 374" role="img" aria-labelledby="title desc">
  <title id="title">Schema 驱动的 Persona UI 与 Module Federation 架构</title>
  <desc id="desc">每个 Persona 提供各自的元数据与 Layout，其中包含各字段所需的额外数据请求定义。Schema Lens 渲染所选 Persona，并在交互时从 Criteria Service 加载这些数据。Host 组合四个可独立部署的 Remote 应用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176a98"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176a98"/></marker>
    <style>
      .eyebrow{font:700 12px Arial,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.065em;fill:#176a98}.title{font:700 16.5px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152a3b}.hero{font:700 24px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152a3b}.sub{font:400 13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152a3b}.small{font:600 11px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152a3b}.node{fill:#fff;stroke:#176a98;stroke-width:1.3}.focus{fill:#e9f5fd;stroke:#176a98;stroke-width:2}.zone{fill:#ffffff;stroke:#176a98;stroke-width:1.3}.line{stroke:#176a98;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#176a98;stroke-width:2;fill:none;marker-end:url(#blueArrow)}.icon{fill:none;stroke:#176a98;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.remote{fill:#fff;stroke:#176a98;stroke-width:1.3}.remoteTitle{font:700 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152a3b}.footer{font:700 12px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152a3b}
    </style>
  </defs>


  <text class="eyebrow" x="0" y="18">动态 PERSONA 渲染</text>
  <rect class="node" x="0" y="42" width="210" height="82" rx="10"/>
  <text class="title" x="18" y="68">Persona Service</text>
  <text class="sub" x="18" y="89">元数据</text>
  <text class="sub" x="18" y="108">Layout JSON</text>
  <path class="line" d="M218 83H248"/>

  <rect class="focus" x="260" y="42" width="250" height="112" rx="12"/>
  <text class="hero" x="284" y="73">Schema Lens</text>
  <text class="sub" x="284" y="103">元数据 → UI 组件</text>
  <text class="small" x="284" y="128">字段 · 校验 · 状态</text>

  <text class="small" x="532" y="70">渲染</text>
  <path class="line" d="M518 84H568"/>
  <rect class="node" x="580" y="42" width="140" height="112" rx="11"/>
  <text class="title" x="598" y="67">Persona UI</text>
  <rect x="598" y="79" width="104" height="23" rx="4" fill="#e9f5fd"/><rect x="598" y="79" width="3" height="23" rx="1.5" fill="#176a98"/><text class="small" x="610" y="94">权限</text>
  <rect x="598" y="108" width="104" height="23" rx="4" fill="#e9f5fd"/><rect x="598" y="108" width="3" height="23" rx="1.5" fill="#176a98"/><text class="small" x="610" y="123">Criteria</text>

  <path class="blueLine" d="M395 162V194"/>
  <text class="small" x="407" y="180">交互时加载</text>
  <rect class="node" x="260" y="198" width="270" height="64" rx="9"/>
  <text class="title" x="278" y="224">Criteria Service</text>
  <text class="sub" x="278" y="247">返回当前界面需要的业务数据</text>

  <line x1="0" y1="283" x2="720" y2="283" stroke="#dce3e9"/>
  <text class="footer" x="0" y="307">设计结果</text>
  <text class="title" x="0" y="333">不同 Persona Layout，共用一套渲染引擎</text>

  <line x1="744" y1="0" x2="744" y2="340" stroke="#dce3e9"/>
  <text class="eyebrow" x="770" y="18">WEBPACK MODULE FEDERATION</text>
  <rect class="zone" x="770" y="34" width="430" height="292" rx="12"/>
  <rect class="focus" x="794" y="52" width="382" height="84" rx="10"/>
  <text class="hero" x="816" y="79">Host</text>
  <text class="sub" x="816" y="103">路由 · 用户上下文</text><text class="sub" x="816" y="124">共享 UI · 错误边界</text>
  <path d="M985 136V159M831 159H1139M831 159V178M934 159V178M1037 159V178M1139 159V178" stroke="#176a98" stroke-width="1.5" fill="none"/>
  <rect class="remote" x="794" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="805" y="204">R 01</text>
  <rect class="remote" x="897" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="908" y="204">R 02</text>
  <rect class="remote" x="1000" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="1011" y="204">R 03</text>
  <rect class="remote" x="1102" y="178" width="74" height="43" rx="8"/><text class="remoteTitle" x="1113" y="204">R 04</text>
  <text class="footer" x="794" y="257">部署</text><text class="sub" x="838" y="257">每个应用独立通过 Nginx 发布</text>
  <text class="footer" x="794" y="283">平台契约</text><text class="sub" x="794" y="307">共享依赖 · API · 故障隔离</text>
</svg>
