<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Schema 驱动的 Persona UI 与 Module Federation 架构</title>
  <desc id="desc">每个 Persona 提供各自的元数据与 Layout，其中包含各字段所需的额外数据请求定义。Schema Lens 渲染所选 Persona，并在交互时从 Criteria Service 加载这些数据。React Host 组合四个可独立部署的 Remote 应用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718691"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0078d4"/></marker>
    <style>
      .eyebrow{font:700 12px Arial,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.065em;fill:#415365}.title{font:700 16.5px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b3b}.hero{font:700 24px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102c3e}.sub{font:400 13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#415365}.small{font:600 11px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526678}.node{fill:#fff;stroke:#b8cbd7;stroke-width:1.3}.focus{fill:#eaf7ff;stroke:#0078d4;stroke-width:2}.zone{fill:#f6fbfe;stroke:#73b9e5;stroke-width:1.3}.line{stroke:#667c89;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#0078d4;stroke-width:2;fill:none;marker-end:url(#blueArrow)}.icon{fill:none;stroke:#0078d4;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.remote{fill:#fff;stroke:#aac8da;stroke-width:1.3}.remoteTitle{font:700 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b3b}.footer{font:700 12px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#415365}
    </style>
  </defs>
  <rect width="1200" height="300" fill="#fafafa"/>

  <text class="eyebrow" x="0" y="18">动态 PERSONA 渲染</text>
  <rect class="node" x="0" y="42" width="210" height="82" rx="10"/>
  <text class="title" x="18" y="68">Persona Service</text>
  <text class="sub" x="18" y="89">元数据</text>
  <text class="sub" x="18" y="108">Layout JSON</text>
  <path class="line" d="M218 83H248"/>

  <rect class="focus" x="260" y="42" width="270" height="112" rx="12"/>
  <text class="hero" x="284" y="73">Schema Lens</text>
  <text class="sub" x="284" y="103">元数据 → React 组件</text>
  <text class="small" x="284" y="128">字段 · 校验 · 状态</text>

  <text class="small" x="540" y="70">渲染</text>
  <path class="line" d="M538 84H568"/>
  <rect class="node" x="580" y="42" width="140" height="112" rx="11"/>
  <text class="title" x="598" y="67">Persona UI</text>
  <rect x="598" y="79" width="104" height="23" rx="4" fill="#e5f3fb"/><rect x="598" y="79" width="3" height="23" rx="1.5" fill="#0078d4"/><text class="small" x="610" y="94">权限</text>
  <rect x="598" y="108" width="104" height="23" rx="4" fill="#f0f6f9"/><rect x="598" y="108" width="3" height="23" rx="1.5" fill="#73b9e5"/><text class="small" x="610" y="123">Criteria</text>

  <path class="blueLine" d="M395 162V194"/>
  <text class="small" x="407" y="180">交互时加载</text>
  <rect class="node" x="260" y="198" width="270" height="50" rx="9"/>
  <text class="title" x="278" y="220">Criteria Service</text>
  <text class="sub" x="278" y="239">返回当前界面需要的业务数据</text>

  <line x1="0" y1="266" x2="720" y2="266" stroke="#c7d6df"/>
  <text class="footer" x="0" y="289">设计结果</text>
  <text class="title" x="70" y="289">不同 Persona Layout，共用一套渲染引擎</text>

  <line x1="744" y1="0" x2="744" y2="300" stroke="#c7d6df"/>
  <text class="eyebrow" x="770" y="18">WEBPACK MODULE FEDERATION</text>
  <rect class="zone" x="770" y="34" width="430" height="222" rx="12"/>
  <rect class="focus" x="794" y="52" width="382" height="62" rx="10"/>
  <text class="hero" x="816" y="79">React Host</text>
  <text class="sub" x="816" y="100">路由 · 用户上下文 · 共享 UI · 错误边界</text>
  <path d="M985 114V137M831 137H1139M831 137V156M934 137V156M1037 137V156M1139 137V156" stroke="#7f9eaf" stroke-width="1.5" fill="none"/>
  <rect class="remote" x="794" y="156" width="74" height="43" rx="8"/><text class="remoteTitle" x="805" y="182">R 01</text>
  <rect class="remote" x="897" y="156" width="74" height="43" rx="8"/><text class="remoteTitle" x="908" y="182">R 02</text>
  <rect class="remote" x="1000" y="156" width="74" height="43" rx="8"/><text class="remoteTitle" x="1011" y="182">R 03</text>
  <rect class="remote" x="1102" y="156" width="74" height="43" rx="8"/><text class="remoteTitle" x="1113" y="182">R 04</text>
  <text class="footer" x="794" y="226">部署</text><text class="sub" x="838" y="226">每个应用独立通过 Nginx 发布</text>
  <text class="footer" x="794" y="247">平台契约</text><text class="sub" x="860" y="247">共享依赖 · API · 故障隔离</text>
</svg>
